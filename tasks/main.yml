---
- name: Ensure groups are present
  ansible.builtin.group:
    name: "{{ item.name }}"
    system: "{{ item.system | default(omit) }}"
    gid: "{{ item.gid | default(omit) }}"
    state: present
  no_log: "{{ not (anxs_debug | default(false) | bool) }}"
  loop: "{{ genericusers_groups }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure users are present
  ansible.builtin.user:
    name: "{{ item.name }}"
    group: "{{ item.group | default(omit) }}"
    groups: "{{ item.groups | join(',') if item.groups is defined else omit }}"
    append: "{{ item.append | default(omit) }}"
    password: "{{ item.pass | default(omit) }}"
    comment: "{{ item.comment | default(omit) }}"
    shell: "{{ item.shell | default(omit) }}"
    uid: "{{ item.uid | default(omit) }}"
    home: "{{ item.home | default(omit) }}"
    system: "{{ item.system | default(omit) }}"
    state: present
  no_log: "{{ not (anxs_debug | default(false) | bool) }}"
  loop: "{{ ansible_facts['genericusers_users'] | default(genericusers_users) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install managed SSH keys
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ genericusers_effective_keys | join('\n') }}"
    state: present
    exclusive: >-
      {{
        item.ssh_keys_exclusive
        | default(genericusers_ssh_keys_exclusive)
        | bool
      }}
  vars:
    genericusers_retired_keys: >-
      {{
        ansible_facts['genericusers_keys_removed']
        | default(genericusers_keys_removed)
        | selectattr('user', 'equalto', item.name)
        | map(attribute='key')
        | list
      }}
    genericusers_effective_keys: >-
      {{
        item.ssh_keys
        | default([])
        | reject('in', genericusers_retired_keys)
        | list
      }}
  no_log: "{{ not (anxs_debug | default(false) | bool) }}"
  loop: "{{ ansible_facts['genericusers_users'] | default(genericusers_users) }}"
  loop_control:
    label: "{{ item.name }}"
  when: genericusers_effective_keys | length > 0

- name: Clear SSH keys for exclusive users with an empty managed set
  ansible.builtin.file:
    path: >-
      {{
        item.home | default('/home/' ~ item.name)
      }}/.ssh/authorized_keys
    state: absent
  vars:
    genericusers_retired_keys: >-
      {{
        ansible_facts['genericusers_keys_removed']
        | default(genericusers_keys_removed)
        | selectattr('user', 'equalto', item.name)
        | map(attribute='key')
        | list
      }}
    genericusers_effective_keys: >-
      {{
        item.ssh_keys
        | default([])
        | reject('in', genericusers_retired_keys)
        | list
      }}
  no_log: "{{ not (anxs_debug | default(false) | bool) }}"
  loop: "{{ ansible_facts['genericusers_users'] | default(genericusers_users) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - genericusers_effective_keys | length == 0
    - item.ssh_keys_exclusive
      | default(genericusers_ssh_keys_exclusive)
      | bool

- name: Remove explicitly retired SSH keys
  ansible.posix.authorized_key:
    user: "{{ item.user }}"
    key: "{{ item.key }}"
    state: absent
  no_log: "{{ not (anxs_debug | default(false) | bool) }}"
  loop: >-
    {{
      ansible_facts['genericusers_keys_removed']
      | default(genericusers_keys_removed)
    }}
  loop_control:
    label: "{{ item.user }}"

- name: Ensure removed users are absent
  ansible.builtin.user:
    name: "{{ item.name }}"
    state: absent
    remove: true
  no_log: "{{ not (anxs_debug | default(false) | bool) }}"
  loop: >-
    {{
      ansible_facts['genericusers_users_removed']
      | default(genericusers_users_removed)
    }}
  loop_control:
    label: "{{ item.name }}"

- name: Ensure removed groups are absent
  ansible.builtin.group:
    name: "{{ item.name }}"
    state: absent
  no_log: "{{ not (anxs_debug | default(false) | bool) }}"
  loop: "{{ genericusers_groups_removed }}"
  loop_control:
    label: "{{ item.name }}"
