---
name: Molecule CI

'on':
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint and module contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run lint and unit tests
        run: make lint test-unit

  test:
    name: Test (${{ matrix.os }}-${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: debian
            version: "12"
            target: test-debian12
          - os: debian
            version: "13"
            target: test-debian13
          - os: ubuntu
            version: "2004"
            target: test-ubuntu2004
          - os: ubuntu
            version: "2204"
            target: test-ubuntu2204
          - os: ubuntu
            version: "2404"
            target: test-ubuntu2404

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Run Molecule target
        run: make ${{ matrix.target }}
